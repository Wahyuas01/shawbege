<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShawBege — Portal Internal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          navy: { 950:'#0A1220', 900:'#0F172A', 800:'#141F38', 700:'#1B2A4A' },
          deep: '#1E40AF', accent: '#3B82F6', teal: '#0EA5B7',
        },
        fontFamily: {
          display: ['"Plus Jakarta Sans"','sans-serif'],
          body: ['Inter','sans-serif'],
          mono: ['"JetBrains Mono"','monospace'],
        },
      },
    },
  }
</script>
<style>
  body { background:#F8FAFC; }
  ::selection { background:#3B82F6; color:#fff; }
  a, button { -webkit-tap-highlight-color: transparent; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid #3B82F6; outline-offset: 2px; border-radius: 4px;
  }
  .view { animation: fade-in .35s ease; }
  @keyframes fade-in { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .navlink.active { background:rgba(59,130,246,0.12); color:#fff; border-left-color:#3B82F6; }
  .navlink.active .nl-ic { color:#60A5FA; }
  .subtab.active { background:#0F172A; color:#fff; }
  table thead th { position:sticky; top:0; background:#F8FAFC; }
  .row-in { animation: fade-in .3s ease; }
  @media (prefers-reduced-motion: reduce) { .view, .row-in { animation:none; } }
</style>
</head>
<body class="font-body text-navy-900 antialiased">

<div class="min-h-screen flex">
  <!-- SIDEBAR -->
  <aside class="hidden lg:flex lg:flex-col w-64 shrink-0 bg-navy-900 text-slate-300 h-screen sticky top-0">
    <div class="h-16 flex items-center gap-2.5 px-6 border-b border-white/10 font-display font-extrabold text-white">
      <span class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 12L12 3L21 12M5 10V20H10V15H14V20H19V10" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      ShawBege
    </div>

    <nav class="flex-1 py-6 px-3 space-y-1 text-sm font-medium">
      <button data-target="overview" class="navlink active w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg border-l-2 border-transparent hover:bg-white/5 transition-colors text-left">
        <svg class="nl-ic shrink-0" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
        Overview
      </button>
      <button data-target="member" class="navlink w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg border-l-2 border-transparent hover:bg-white/5 transition-colors text-left">
        <svg class="nl-ic shrink-0" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Member Directory
      </button>
      <button data-target="warehouse" class="navlink w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg border-l-2 border-transparent hover:bg-white/5 transition-colors text-left">
        <svg class="nl-ic shrink-0" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V21H3V8"/><path d="M1 3h22v5H1z"/><path d="M10 12h4"/></svg>
        Warehouse
      </button>
      <button data-target="workshop" class="navlink w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg border-l-2 border-transparent hover:bg-white/5 transition-colors text-left">
        <svg class="nl-ic shrink-0" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Workshop Center
      </button>
    </nav>

    <div class="p-4 border-t border-white/10">
      <div class="flex items-center gap-3 bg-white/5 rounded-xl p-3">
        <div id="userAvatar" class="w-9 h-9 rounded-full bg-gradient-to-br from-accent to-teal flex items-center justify-center font-display font-bold text-white text-sm shrink-0">SB</div>
        <div class="min-w-0">
          <p id="userName" class="text-sm font-semibold text-white truncate">Memuat...</p>
          <p id="userRole" class="text-xs text-slate-400 truncate">Member</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN MAIN -->
  <div class="flex-1 min-w-0">
    <header class="sticky top-0 z-30 h-16 bg-white/85 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-5 lg:px-8">
      <div class="flex items-center gap-2 text-sm">
        <span class="lg:hidden font-display font-extrabold text-navy-900">ShawBege</span>
        <span id="crumb" class="hidden lg:inline text-slate-400 font-mono text-xs uppercase tracking-widest">Portal Internal</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="hidden sm:flex items-center gap-1.5 text-xs font-mono text-green-600 bg-green-50 border border-green-200 rounded-full px-3 py-1">
          <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span> Live
        </span>
        <button id="btnLogout" class="text-sm font-semibold text-slate-500 hover:text-navy-900 transition-colors">Keluar</button>
      </div>
    </header>

    <main class="p-5 lg:p-8 max-w-7xl mx-auto">
      <section id="view-overview" class="view">
        <h1 id="welcomeText" class="font-display font-extrabold text-2xl lg:text-3xl tracking-tight">Halo... 👋</h1>
        <p class="text-slate-500 mt-1.5">Ringkasan operasional komunitas ShawBege hari ini.</p>
      </section>

      <section id="view-member" class="view hidden">
        <h1 class="font-display font-extrabold text-2xl lg:text-3xl tracking-tight">Member Directory</h1>
      </section>

      <section id="view-warehouse" class="view hidden">
        <h1 class="font-display font-extrabold text-2xl lg:text-3xl tracking-tight">Warehouse Management</h1>
      </section>

      <section id="view-workshop" class="view hidden">
        <h1 class="font-display font-extrabold text-2xl lg:text-3xl tracking-tight">Workshop Center</h1>
      </section>
    </main>
  </div>
</div>

<!-- SCRIPT TUNGGAL (BERSIH) -->
<script type="module">
  import { supabase } from './lib/supabase.js'

  // NAVIGASI UI
  const crumbMap = { overview:'Overview', member:'Member Directory', warehouse:'Warehouse', workshop:'Workshop Center' };
  document.querySelectorAll('.navlink, .navshortcut').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.target;
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.getElementById('view-' + target)?.classList.remove('hidden');
      document.querySelectorAll('.navlink').forEach(b => b.classList.toggle('active', b.dataset.target === target));
      const crumb = document.getElementById('crumb');
      if (crumb) crumb.textContent = crumbMap[target] || 'Portal Internal';
    });
  });

  // AUTENTIKASI SUPABASE (CEGAH MENTAL)
  async function initAuth() {
    const hasTokenInUrl = window.location.hash.includes('access_token');

    // Beri waktu 500ms jika membawa token OAuth dari Discord
    if (hasTokenInUrl) {
      await new Promise(resolve => setTimeout(resolve, 500));
    }

    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
      window.location.href = '/index.html';
      return;
    }

    if (window.location.hash) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    const discordName = session.user.user_metadata?.full_name || session.user.user_metadata?.name || 'Member';
    
    document.getElementById('userName').textContent = discordName;
    document.getElementById('welcomeText').textContent = `Halo, ${discordName} 👋`;
    document.getElementById('userAvatar').textContent = discordName.substring(0, 2).toUpperCase();
  }

  document.getElementById('btnLogout')?.addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = '/index.html';
  });

  document.addEventListener('DOMContentLoaded', initAuth);
</script>
</body>
</html>
